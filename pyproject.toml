[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitclf"
version = "1.0.0"
description = "Vision Transformer (ViT) for Image Classification - from-scratch + fine-tuned, explainable, deployable"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
