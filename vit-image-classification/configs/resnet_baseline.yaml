# CNN baseline so the ViT results have something honest to be compared against
experiment: resnet50_baseline
seed: 42
data:
  root: data
  img_size: 224
  num_workers: 4
  val_size: 0.15
  test_size: 0.15
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  ra_num_ops: 2
  ra_magnitude: 9
  random_erasing: 0.25
model:
  source: timm
  name: resnet50.a1_in1k
  pretrained: true
  drop_path: 0.05
train:
  epochs: 10
  batch_size: 64
  lr: 2.0e-4
  weight_decay: 0.05
  warmup_epochs: 1
  label_smoothing: 0.1
  mixup_alpha: 0.2
  cutmix_alpha: 1.0
  mix_prob: 0.5
  grad_clip: 1.0
  amp: true
  out_dir: runs
